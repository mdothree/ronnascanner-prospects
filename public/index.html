<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RonnaScanner — Prospect Research Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- SEO & Social -->
  <meta name="description" content="Deep company research: funding history, tech stack, hiring signals, key employees, and recent news." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://ronnascanner.com/prospects" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ronnascanner.com/prospects" />
  <meta property="og:title" content="RonnaScanner — Prospect Research Tool" />
  <meta property="og:description" content="Deep company research: funding history, tech stack, hiring signals, key employees, and recent news." />
  <meta property="og:image" content="https://ronnascanner.com/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RonnaScanner — Prospect Research Tool" />
  <meta name="twitter:description" content="Deep company research: funding history, tech stack, hiring signals, key employees, and recent news." />
  <meta name="twitter:image" content="https://ronnascanner.com/og-image.png" />

  <!-- Theme color -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F97316" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
    <nav class="nav" aria-label="Main navigation">
    <a href="/" class="nav-brand">ronna<span>.</span>scanner</a>
    <div class="nav-links">
      <span class="plan-badge plan-badge-pro plan-badge-hidden" id="plan-badge"></span>
      <a href="#" id="nav-login" class="nav-link">Sign In</a>
      <button class="btn-upgrade-nav nav-upgrade-hidden" id="nav-upgrade">&#9889; Upgrade</button>
      <button class="btn-icon nav-manage-hidden" id="nav-manage">Manage Plan</button>
      <a href="#" id="nav-signup" class="btn-nav">Free Trial</a>
    </div>
  </nav>
  <div class="modal-overlay hidden" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close dialog">&times;</button>
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="signup">Sign Up</button>
      </div>
      <div class="tab-content" id="tab-login">
        <input type="email" class="input" id="login-email" placeholder="Email" />
        <input type="password" class="input" id="login-password" placeholder="Password" />
        <button class="btn-primary full" id="btn-login" aria-label="Sign in to your account">Sign In</button>
      </div>
      <div class="tab-content hidden" id="tab-signup">
        <input type="text" class="input" id="signup-name" placeholder="Full Name" />
        <input type="email" class="input" id="signup-email" placeholder="Email" />
        <input type="password" class="input" id="signup-password" placeholder="Password" />
        <button class="btn-primary full" id="btn-signup" aria-label="Create a new account">Start Free Trial</button>
      </div>
      <p class="auth-error hidden" id="auth-error"></p>
    </div>
  </div>
  <section class="hero" id="main-content">
    <div class="hero-badge">Deep Prospect Intelligence</div>
    <h1 class="hero-title"><em>Prospect Research Tool</em></h1>
    <p class="hero-sub">Get a full 360° profile on any company or person before your outreach.</p>
  </section>
  <section class="tool-section" aria-label="Main tool" id="tool">
    <div id="usage-meter-container"></div>
    <div class="tool-container" id="tool-container">
      <div class="tool-panel">
        <div class="panel-header"><span class="panel-num">01</span><h2>Prospect Research</h2></div>
        <div class="filter-grid">
          <div><label class="field-label">Company Name or URL</label><input type="text" class="input" id="filter-company" placeholder="e.g. stripe.com or Stripe"/></div>
          <div><label class="field-label">Research Depth</label>
            <select class="input" id="filter-depth">
              <option value="quick">Quick Snapshot</option>
              <option value="standard" selected>Standard Report</option>
              <option value="deep">Deep Research (Pro)</option>
            </select></div>
          <div><label class="field-label">Focus Areas</label>
            <select class="input" id="filter-focus">
              <option value="all">All Areas</option>
              <option value="funding">Funding & Investors</option>
              <option value="tech">Tech Stack</option>
              <option value="hiring">Hiring Signals</option>
              <option value="news">Recent News</option>
            </select></div>
        </div>
        <div class="tool-actions">
          <button class="btn-primary large" id="btn-research">
            <span class="btn-text">🔭 Research Prospect</span>
            <span class="btn-loader hidden">Researching...</span>
          </button>
        </div>
      </div>
      <div class="results-panel hidden" id="results-panel">
        <div id="prospect-report"></div>
        <div class="toolbar-actions" class="mt-1">
          <button class="btn-icon" id="btn-export">⬇️ Export PDF</button>
          <button class="btn-icon" id="btn-save" aria-label="Save result">💾 Save Report</button>
        </div>
      </div>
    </div>
  </section>
  <footer class="footer">
    <p>&copy; 2025 ronnascanner.com &mdash; Powered by Apollo, Hunter &amp; Clearbit</p>
  </footer>
  <script type="module" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
